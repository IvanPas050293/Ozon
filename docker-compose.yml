services:
  ozon-bot:
    build: .
    image: ozon-bot:latest
    container_name: ozon-bot
    # Автозапуск после перезагрузки сервера; рестарт при падениях
    restart: unless-stopped
    # Используем сеть хоста: на ряде российских VPS IPv4 до Telegram
    # заблокирован, а IPv6 работает только на хосте (в контейнере его нет).
    network_mode: host

    environment:
      BOT_USERNAME: ${BOT_USERNAME:-ozon_analytics_bot}
      # Fail-fast: без BOT_TOKEN в .env контейнер не запустится
      BOT_TOKEN: ${BOT_TOKEN:?Задайте BOT_TOKEN в файле .env}
      TAX_SYSTEM: ${TAX_SYSTEM:-1}
      TAX_RATE: ${TAX_RATE:-0.06}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      # На ряде российских VPS исходящий IPv4 до api.telegram.org заблокирован,
      # а IPv6 работает. Заставляем Java ходить через IPv6.
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx512m -Djava.net.preferIPv6Addresses=true}

    volumes:
      # H2-база бота (настройки магазинов, себестоимость) живёт на диске сервера
      - ./data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
